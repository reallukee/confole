name: Pack

on:
  push:
    branches:
      - "**"
    paths:
      - "**/*.fsi"
      - "**/*.fs"
      - "**/*.fsproj"
      - "**/*.cs"
      - "**/*.csproj"
      - "**/*.sln"
      - "**/*.slnx"

      - "!**/dev/**"
      - "!**/examples/**"
      - "!**/templates/**"
      - "!**/test/**"
  workflow_dispatch:

jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Restore projects
        run: |
          dotnet restore confole --ignore-failed-sources
          dotnet restore confole.sharp --ignore-failed-sources
          dotnet restore confole.templates --ignore-failed-sources

      - name: Build projects
        run: |
          dotnet build confole --no-restore --configuration Release
          dotnet build confole.sharp --no-restore --configuration Release
          dotnet build confole.templates --no-restore --configuration Release

      - name: Pack projects
        run: |
          dotnet pack confole --configuration Release
          dotnet pack confole.sharp --configuration Release
          dotnet pack confole.templates --configuration Release
